name: Shared pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser_suite:
        description: Browser regression suite
        type: choice
        default: full
        options: [full, loop]

permissions:
  contents: read

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python -m unittest discover -s tests -q
      - run: python build_trainer.py tests/fixtures/shared-regressions.musicxml --project-dir ../melete-ci-demo

  browser:
    runs-on: ubuntu-latest
    env:
      # Exercise Web Audio and its worklets without an uncontrolled host speaker.
      QA_SILENT_OUTPUT: '1'
      QA_LOOP_RELOAD_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_suite == 'loop' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  recording-compatibility:
    if: github.event_name != 'workflow_dispatch' || inputs.browser_suite == 'full'
    # Test Safari's media stack on macOS, not the Linux GStreamer WebKit port.
    runs-on: ${{ matrix.engine == 'webkit' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit, chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Start a virtual sound card for Firefox capture and playback
        if: matrix.engine == 'firefox'
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=melete_ci
          pactl set-default-sink melete_ci
          pactl set-default-source melete_ci.monitor
      - run: npm run test:compat -- ${{ matrix.engine }}
      - run: npm run test:offline -- ${{ matrix.engine }}
      - run: node tests/browser-display-identity.cjs
        env:
          QA_DISPLAY_BROWSER: ${{ matrix.engine }}
      # Use macOS for the real, unmanaged Chrome focus test, like the rehearsal
      # browser. The Linux Chromium job still exercises recording and offline updates.
      - if: matrix.engine == 'webkit'
        run: npx playwright install chromium
      - if: matrix.engine == 'webkit'
        run: node tests/browser-tab-handoff.cjs
